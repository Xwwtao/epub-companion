<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>章节</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<p><a href="/">← 书架</a> · <a id="summary-link">前情提要</a></p>
<div id="book"></div>
<ol id="chapters"></ol>

<script src="app.js"></script>
<script>
const bookId = new URLSearchParams(location.search).get("id");
document.getElementById("summary-link").href = `summary.html?id=${bookId}`;

async function render() {
  let book;
  try {
    book = await api(`/api/books/${bookId}`);
  } catch (err) {
    document.getElementById("book").textContent = err.message;
    return;
  }
  document.title = book.title;
  const header = document.getElementById("book");
  header.replaceChildren(
    book.has_cover ? el("img", { src: `/api/books/${book.id}/cover`, class: "cover", alt: "" }) : "",
    el("h1", {}, book.title),
    el("p", {}, book.author || "未知作者"),
    el("p", {}, el("strong", {}, `正在读第 ${book.current_chapter} 章 / 共 ${book.chapter_count} 章`),
      `（第 1 ~ ${book.current_chapter - 1} 章算已读）`),
  );

  const list = document.getElementById("chapters");
  list.replaceChildren();
  for (const ch of book.chapters) {
    const label = [...ch.parent_titles, ch.title].join(" · ");
    const state = ch.number < book.current_chapter ? "read"
      : ch.number === book.current_chapter ? "current" : "unread";

    const readBtn = el("button", {}, "正在读这一章");
    readBtn.disabled = state === "current";
    readBtn.onclick = () => update(`/api/books/${book.id}/progress`, { chapter: ch.number });

    const skip = el("input", { type: "checkbox" });
    skip.checked = ch.skipped;
    skip.onchange = () => update(`/api/books/${book.id}/chapters/${ch.number}/skipped`, { skipped: skip.checked });

    list.append(el("li", { class: state },
      el("span", { class: "label" }, label),
      state === "current" ? el("span", { class: "tag" }, "正在读") : "",
      state === "unread" ? el("span", { class: "tag" }, "未读") : "",
      ch.mentions_book_info
        ? el("span", { class: ch.skipped ? "tag" : "tag warn", title: "这一页含书名和作者，不跳过的话会随正文发给模型" },
            ch.skipped ? "含书名/作者" : "含书名/作者，建议跳过")
        : "",
      " ", readBtn, " ",
      el("label", {}, skip, "跳过（非正文）"),
    ));
  }
}

async function update(path, body) {
  try {
    await api(path, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (err) {
    alert(err.message);
  }
  render();
}

render();
</script>
</body>
</html>
