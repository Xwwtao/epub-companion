<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书架</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>书架</h1>

<form id="upload">
  <input type="file" name="file" accept=".epub" required>
  <button type="submit">导入 EPUB</button>
  <span id="status"></span>
</form>

<ul id="books"></ul>

<script src="app.js"></script>
<script>
const statusEl = document.getElementById("status");

async function render() {
  const list = document.getElementById("books");
  list.replaceChildren();
  const books = await api("/api/books");
  if (books.length === 0) list.append(el("li", {}, "还没有书，先导入一本吧。"));
  for (const b of books) {
    const del = el("button", {}, "删除");
    del.onclick = async () => {
      if (!confirm(`删除《${b.title}》？摘要缓存也会一起删除。`)) return;
      await api(`/api/books/${b.id}`, { method: "DELETE" });
      render();
    };
    list.append(el("li", {},
      el("a", { href: `book.html?id=${b.id}` }, b.title),
      ` — ${b.author || "未知作者"} · 正在读第 ${b.current_chapter} 章 / 共 ${b.chapter_count} 章 `,
      del,
    ));
  }
}

document.getElementById("upload").onsubmit = async (e) => {
  e.preventDefault();
  statusEl.textContent = "导入中…";
  try {
    await api("/api/books", { method: "POST", body: new FormData(e.target) });
    statusEl.textContent = "导入成功";
    e.target.reset();
    render();
  } catch (err) {
    statusEl.textContent = `导入失败：${err.message}`;
  }
};

render();
</script>
</body>
</html>
