<!doctype html>
<html lang="zh-CN">
<head>
<title>前情提要 · 读书伴侣</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 前端单独部署时填后端地址，如 https://api.example.com；同源部署留空 -->
<meta name="api-base" content="">
<meta name="theme-color" content="#f6f2ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239a5b2f'/%3E%3Cpath d='M9 9h9a5 5 0 0 1 5 5v9h-9a5 5 0 0 1-5-5z' fill='none' stroke='%23fffaf3' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- 在样式生效前应用主题和字号，避免刷新时先闪一下默认主题 -->
<script>
try {
  var d = document.documentElement, get = function (k, v) { var r = localStorage.getItem("ec." + k); return r === null ? v : JSON.parse(r); };
  if (get("theme", "auto") !== "auto") d.dataset.theme = get("theme", "auto");
  d.style.setProperty("--read-size", get("fontSize", 18) + "px");
  if (get("veilUnread", true)) d.classList.add("veil-unread");
} catch (e) {}
</script>
<script src="js/common.js"></script>
<script src="js/summary.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="返回书架">
    <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h8a6 6 0 0 1 6 6v8h-8a6 6 0 0 1-6-6z"/></svg></span>
    读书伴侣
  </a>
  <nav class="crumb" aria-label="当前位置"><span class="sep">/</span><span class="here" id="crumb-title">前情提要</span></nav>
  <span class="spacer"></span>
  <button class="btn btn-ghost btn-icon" id="settings-btn" type="button" aria-label="阅读设置" aria-expanded="false" title="阅读设置">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main class="page">
  <section class="book-hero" id="hero"></section>
  <div id="notice"></div>
  <div id="gen-status"></div>

  <section class="section" aria-labelledby="h-last">
    <div class="section-head"><h2 id="h-last">上次读到哪</h2></div>
    <div id="last-read"></div>
  </section>

  <section class="section" aria-labelledby="h-recap">
    <div class="section-head"><h2 id="h-recap">整体回顾</h2><span class="hint" id="recap-hint"></span></div>
    <div id="recap"></div>
  </section>

  <section class="section" aria-labelledby="h-chapters">
    <div class="section-head">
      <h2 id="h-chapters">逐章摘要</h2>
      <button class="btn btn-ghost btn-sm" id="toggle-all" type="button" hidden>全部展开</button>
    </div>
    <div id="summaries"></div>
  </section>
</main>
</body>
</html>
